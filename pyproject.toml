[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-ffi-verifier"
version = "1.0.0"
description = "Automated FFI contract verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Darshit Lagdhir", email = "darshit@example.com"}
]
maintainers = [
    {name = "Darshit Lagdhir", email = "darshit@example.com"}
]
keywords = ["ffi", "verification", "testing", "contracts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "libclang>=16.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/darshit-lagdhir/polyglot-ffi-verifier"
Documentation = "https://polyglot-ffi-verifier.readthedocs.io"
Repository = "https://github.com/darshit-lagdhir/polyglot-ffi-verifier"
Issues = "https://github.com/darshit-lagdhir/polyglot-ffi-verifier/issues"

[project.scripts]
polyglot-verify = "polyglot_ffi_verifier.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "system: System tests",
    "e2e: End-to-end tests",
    "compatibility: Compatibility tests",
    "benchmark: Performance benchmarks",
    "stress: Stress tests",
    "slow: Tests that take more than a few seconds",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
