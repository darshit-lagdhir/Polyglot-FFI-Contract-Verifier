name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-14-dev llvm-14-dev build-essential
          # Create symlink to standard library path for robust discovery
          sudo ln -sf /usr/lib/llvm-14/lib/libclang.so.1 /usr/lib/libclang.so
          sudo ln -sf /usr/lib/llvm-14/lib/libclang.so.1 /usr/lib/libclang-14.so
          echo "Verifying libclang installation:"
          ls -l /usr/lib/llvm-14/lib/libclang*
          ls -l /usr/lib/libclang*

      - name: Build examples (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd examples/simple_calculator && bash build.sh

      - name: Build examples (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd examples/simple_calculator
          ./build.bat

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
          pip install pytest pytest-timeout pytest-cov
      
      - name: Run all tests
        timeout-minutes: 15
        env:
          LD_LIBRARY_PATH: /usr/lib/llvm-14/lib
        run: |
          pytest -v -ra -c config/pytest.ini --timeout=30 -W error
  
  e2e:
    name: End-to-End Tests
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
          pip install pytest pytest-timeout
      
      - name: Build examples
        run: |
          cd examples/simple_calculator
          ./build.bat

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v -ra -m e2e --timeout=300 -c config/pytest.ini -W error
  
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flake8
      
      - name: Lint with flake8
        run: |
          flake8 modules/module_04_native_interface_ingestion/ --count --max-line-length=120 --statistics --extend-ignore=E501,W503,E402,F401,F841,F403,E302,E305,E261,E701,E111,E114,E117,E131,F811,E266,E221,E203,F541,E128,E303,W291,W293
