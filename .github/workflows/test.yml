name: Test

"on":
  push:
    branches: [ main, develop ]
    paths:
      - 'modules/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest pytest-cov PyYAML black==23.3.0 flake8==6.0.0 isort==5.12.0 mypy==1.3.0 radon
    
    - name: Code Quality (Lint & Format)
      run: |
        black --check --diff modules/
        isort --check-only --diff modules/
        flake8 modules/ --max-line-length=100 --extend-ignore=E203,W503 --count --statistics
    
    - name: Type check with mypy
      run: mypy modules/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true
    
    - name: Run Module 06 Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/modules
        pytest tests/unit/test_contract_*.py \
          tests/unit/test_clause_types.py \
          tests/unit/test_enforcement_boundary.py \
          tests/unit/test_module_06_init.py \
          tests/unit/test_documentation.py \
          tests/unit/test_ci_cd_config.py \
          -v \
          --cov=modules/module_06_contract_schema \
          --cov-report=xml:coverage_m06.xml \
          --cov-fail-under=85
    
    - name: Run Global Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/modules
        pytest tests/unit/ -v --cov --cov-append --cov-report=xml
        pytest tests/integration/ -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml,./coverage_m06.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
