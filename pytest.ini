[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --strict-markers
    --tb=short

# Markers
markers =
    e2e: end-to-end tests (slow)
    slow: slow tests
    integration: integration tests
    unit: unit tests

# Timeout
timeout = 300
