[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --strict-markers
    --tb=short
    -W ignore::DeprecationWarning

# Markers
markers =
    e2e: end-to-end tests (may require built libraries)
    slow: slow tests
    integration: integration tests
    unit: unit tests
    system: system tests
    benchmark: performance benchmarks
    stress: stress tests
    compatibility: compatibility tests

# Timeout
timeout = 300
