[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .tox dist build *.egg .cache .pytest_cache __pycache__ node_modules

# Output
addopts = 
    -v
    -ra
    --strict-markers
    --tb=short
    -W error
    -W ignore::DeprecationWarning:datetime.*
    -W ignore::DeprecationWarning:clang.*

# Markers
markers =
    e2e: end-to-end tests (may require built libraries)
    slow: slow tests
    integration: integration tests
    unit: unit tests
    system: system tests
    benchmark: performance benchmarks
    stress: stress tests
    compatibility: compatibility tests

# Timeout
timeout = 600
timeout_method = thread
