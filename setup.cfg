[metadata]
name = polyglot-ffi-verifier
version = attr: polyglot_ffi_verifier.__version__.__version__
author = Darshit Lagdhir
author_email = darshit@example.com
description = Automated FFI contract verification for polyglot applications
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/darshit-lagdhir/polyglot-ffi-verifier
project_urls =
    Bug Tracker = https://github.com/darshit-lagdhir/polyglot-ffi-verifier/issues
    Documentation = https://polyglot-ffi-verifier.readthedocs.io
    Source Code = https://github.com/darshit-lagdhir/polyglot-ffi-verifier
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Topic :: Software Development :: Testing
    Topic :: Software Development :: Quality Assurance
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
keywords = ffi, verification, testing, contracts, polyglot

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    libclang>=16.0.0
    
[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    polyglot-verify = polyglot_ffi_verifier.cli:main

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-timeout>=2.1.0
    black>=23.0.0
    flake8>=6.0.0
    mypy>=1.0.0
docs =
    sphinx>=5.0.0
    sphinx-rtd-theme>=1.2.0
